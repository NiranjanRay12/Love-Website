<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(135deg,#ff416c,#8e2de2);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:700px;
    padding:40px 25px;
    background:rgba(255,255,255,.12);
    border-radius:30px;
    backdrop-filter:blur(12px);
    box-shadow:0 0 50px rgba(0,0,0,.25);
}

.heart{
    font-size:90px;
    animation:beat 1s infinite;
}

h1{
    font-size:60px;
    margin:15px 0;
}

p{
    font-size:21px;
    line-height:1.6;
}

button{
    border:0;
    padding:16px 30px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:#e91e63;
    background:white;
}

button:hover{
    transform:scale(1.08);
}

#message{
    display:none;
    margin-top:25px;
    font-size:25px;
    font-weight:bold;
}

.floating{
    position:absolute;
    bottom:-50px;
    animation:float 6s linear forwards;
}

@keyframes beat{
    50%{transform:scale(1.2);}
}

@keyframes float{
    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>I Love You</h1>

    <p>
        I made this little website just for you. 💕
        <br>
        Because some feelings are too special for ordinary words.
    </p>

    <button onclick="showLove()">
        Open My Heart 💌
    </button>

    <div id="message">
        You are my favorite person. 🥰❤️
        <br><br>
        Will you be mine? 💍
    </div>

</div>

<script>

function showLove(){
    document.getElementById("message").style.display="block";

    for(let i=0;i<30;i++){
        setTimeout(createHeart,i*100);
    }
}

function createHeart(){

    const heart=document.createElement("div");

    heart.className="floating";
    heart.innerHTML=["❤️","💕","💖","💗","💘"][
        Math.floor(Math.random()*5)
    ];

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*30)+"px";
    heart.style.animationDuration=(3+Math.random()*4)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart,500);

</script>

</body>
</html>
